name: Admin CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: admin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout admin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout admin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: websivi-admin
          persist-credentials: false

      - name: Checkout backend integration dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: khanhlinhcode/BE_Farta-Market-
          ref: 4af1d2f9344b3254688685ccfdcdf8dd85b57f7b
          path: SVC01072023BE/SVC01072023BE
          persist-credentials: false

      - name: Checkout storefront integration dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: khanhlinhcode/Farta_Market
          ref: ff73ea5c9086281d2ec65abba0657a6df6f6deab
          path: websivi
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            websivi-admin/package-lock.json
            websivi/package-lock.json

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: SVC01072023BE/SVC01072023BE

      - name: Install storefront dependencies
        run: npm ci
        working-directory: websivi

      - name: Install admin dependencies
        run: npm ci
        working-directory: websivi-admin

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: websivi-admin

      - name: Run Playwright E2E
        run: npm run test:e2e
        working-directory: websivi-admin

      - name: Upload failed Playwright traces
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: admin-playwright-traces
          path: websivi-admin/test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 3
